[package]
name = "beans-mostly"
version = "0.2.0"
edition = "2024"
description = "Search local grocery stores and match recipes to your shopping list or pantry (and back)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "beans-mostly"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
axum = "0.8.9"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
